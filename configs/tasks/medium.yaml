difficulty: medium
name: "Case-insensitive Bearer token prefix"
description: |
  Our API rejects Authorization headers with a lowercase or mixed-case
  Bearer prefix, e.g. "bearer <token>" or "BEARER <token>".
  RFC 6750 §2.1 says the scheme name MUST be matched case-insensitively,
  so those headers are valid and we have a bug.

  Fix the bug and add a regression test for the lowercase case.
  The new test must be added at the END of the existing test file —
  do NOT insert it inside another function's body.
test_cmd: "uv run --extra dev pytest tests/unit/test_admin_auth.py -q"
timeout_sec: 600
target_file: "tests/unit/test_admin_auth.py"
required_files:
  - "app/services/admin_auth.py"
  - "tests/unit/test_admin_auth.py"
success_criteria:
  - "parse_bearer_token handles case-insensitive Bearer prefix"
  - "All pre-existing tests pass"
