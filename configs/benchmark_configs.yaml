benchmark:
  repo: "C:\\Users\\User\\a_projects\\process_metrics_platform_v2"
  test_cmd: "uv run --extra dev pytest tests/unit/ -x -q"
  timeout_sec: 1200
  task: >
    Add exactly ONE new async test function to tests/unit/test_api_google_oauth.py.
    Name it test_google_redirect_includes_required_scopes. It must verify that
    the Google OAuth redirect URL contains all three required OAuth scopes: openid,
    email, and profile. Use the existing pattern from the file: decorate with
    @pytest.mark.asyncio, create a request with _make_request(), call
    await admin_api.admin_google_redirect(request, return_to=None), then use
    urlparse and parse_qs (both imported at line 2) to extract the scope query
    parameter from response.headers['location'] and assert 'openid', 'email',
    and 'profile' are all present in it. Do not modify any other file.

configs:
  - id: "01_cursor_like"
    name: "Cursor-like"
    archetype: "cursor"
    tools: ["repo_map", "simple_rag", "read", "write", "patch", "insert_after", "shell"]
    model: "openai/gpt-4.1-mini"
    max_steps: 50

