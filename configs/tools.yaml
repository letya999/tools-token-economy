  - id: "16_serena_only"
    name: "Semantic: Serena Only"
    archetype: "semantic"
    tools: ["serena", "read", "write", "edit", "patch", "insert", "append"]
    tool_restriction_prefix: |
      Use serena for navigation. Example: find_symbol("my_func").
      DO NOT use shell commands, grep, or read for code navigation.
      Use find_symbol('function_name') to locate code, then find_referencing_symbols to understand callers.
      Only use read after locating the exact file via symbol search.
      Prescribed tools: serena, read, write, edit, patch, insert, append.
