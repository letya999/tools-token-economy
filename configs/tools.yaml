configs:
  - id: "01_cursor_like"
    name: "Cursor-like"
    archetype: "cursor"
    tools: ["repo_map", "simple_rag", "read", "write", "edit", "patch", "insert", "append", "shell"]
    tool_restriction_prefix: |
      Use repo_map for navigation. Example: repo_map().
      Do NOT fall back to bash/shell/grep unless the prescribed tool fails with an error.
      Prescribed tools: repo_map, simple_rag, read, write, edit, patch, insert, append, shell.
  - id: "02_claude_code_like"
    name: "Claude Code-like"
    archetype: "claude"
    tools: ["glob", "rg", "read", "write", "edit", "patch", "insert", "append", "shell"]
    tool_restriction_prefix: |
      Use glob for navigation. Example: glob("**/*.py").
      Do NOT fall back to bash/shell/grep unless the prescribed tool fails with an error.
      Prescribed tools: glob, rg, read, write, edit, patch, insert, append, shell.
