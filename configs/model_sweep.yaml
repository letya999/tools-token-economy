# Agent models under test for tool stability. 
# Judge stays fixed (configured in provider.yaml).
models:
  - provider: "openai"
    model: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
  - provider: "openai"
    model: "gpt-4.1-nano"
    api_key_env: "OPENAI_API_KEY"
  - provider: "anthropic"
    model: "claude-3-5-haiku"
    api_key_env: "ANTHROPIC_API_KEY"
  - provider: "google"
    model: "gemini-2.5-flash"
    api_key_env: "GOOGLE_API_KEY"
