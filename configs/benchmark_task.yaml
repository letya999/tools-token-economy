# Benchmark target repository and task definition
# Spec: "один средний реальный репозиторий + одна фиксированная задача"

target_repo:
  url: "https://github.com/letya999/process_metrics_platform_v2"
  # Freeze to a specific commit for full reproducibility
  # Run: git rev-parse HEAD  after cloning to get this value
  commit: "HEAD"
  local_path: ""  # Set after cloning, e.g. /home/user/repos/process_metrics_platform_v2

task:
  description: |
    Add schedule and sensor management to the admin API.

    The application already has a Dagster-based pipeline system with schedules and sensors.
    The admin API currently has job management endpoints. Extend it by adding:

    1. Endpoints to list all Dagster schedules with their current running status
    2. Endpoints to start and stop individual schedules by name
    3. Endpoints to list all Dagster sensors with their current running status
    4. Endpoints to start and stop individual sensors by name

    Follow the existing patterns in the codebase for authentication, error handling,
    and response formatting. Add at least one unit test for the new functionality.

    You MUST use write or patch to save changes to disk. Reading without writing is a failure.
    When done, output exactly: TASK_COMPLETE

  test_cmd: "python -m pytest tests/unit/ -v --tb=short -q"

  success_criteria:
    - "New schedule and sensor endpoints are present in the codebase"
    - "At least one new unit test added"
    - "Existing tests still pass"

setup:
  # Run these once to prepare the benchmark environment (from WSL)
  clone_cmd: "git clone https://github.com/letya999/process_metrics_platform_v2 /tmp/benchmark_repo"
  install_cmd: "cd /tmp/benchmark_repo && pip install -e ."
  # OpenCode model: uses google/gemini-2.5-flash (free tier, 10 RPM)

# Usage:
#   python main.py \
#     --repo /tmp/benchmark_repo \
#     --task "$(python -c \"import yaml; print(yaml.safe_load(open('configs/benchmark_task.yaml'))['task']['description'])\")" \
#     --test-cmd "python -m pytest tests/ -v --tb=short -q -m 'unit or not integration'" \
#     --results results_real
