# Benchmark target repository and task definition
# Spec: "один средний реальный репозиторий + одна фиксированная задача"

target_repo:
  url: "https://github.com/letya999/process_metrics_platform_v2"
  # Freeze to a specific commit for full reproducibility
  commit: "HEAD"
  # The orchestrator will try to find this path or clone it.
  # Use project-relative or absolute path. 
  local_path: "process_metrics_platform_v2"

# Task is now decoupled into configs/tasks/aging_stale.yaml
# This file is kept for backward compatibility and as a fallback.
task:
  name: "Work item aging: add is_stale flag"
  description_file: "configs/tasks/aging_stale.yaml"

setup:
  # Run these once to prepare the benchmark environment (from WSL)
  clone_cmd: "git clone https://github.com/letya999/process_metrics_platform_v2 process_metrics_platform_v2"
  install_cmd: "cd process_metrics_platform_v2 && uv sync --extra dev"
