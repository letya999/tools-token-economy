[project]
name = "tools-token-economy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "ruff>=0.15.14",
    "tiktoken>=0.13.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "mcp>=1.0.0",
    "jedi>=0.19.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/infrastructure/*"]

[tool.coverage.report]
fail_under = 75
